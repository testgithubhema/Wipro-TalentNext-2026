<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>

<body>

<center>

    <h2><font color="blue">Account Login</font></h2>

    <form>

        <table border="2" cellpadding="8">

            <tr>
                <td><b>User Name:</b></td>
                <td>
                    <input type="text" maxlength="8" size="12">
                </td>
            </tr>

            <tr>
                <td><b>Password:</b></td>
                <td>
                    <input type="password" maxlength="8" size="12">
                </td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                    <input type="submit" value="Login">
                </td>
            </tr>

        </table>

    </form>

</center>

</body>
</html>
