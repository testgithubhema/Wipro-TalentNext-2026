<!DOCTYPE html>
<html>
<head>
    <title>HTML5 Attributes - Forms</title>
</head>

<body>

    <!-- Assignment 2 - Visitors Information -->
    <div>
        <h2>Visitors information</h2>

        <hr>

        <form>
            <table>

                <tr>
                    <td>Email address:</td>
                    <td>
                        <input type="email"
                               name="email"
                               placeholder="Enter your email"
                               required>
                    </td>
                </tr>

                <tr>
                    <td>User's interest:</td>
                    <td>
                        <input type="checkbox" name="interest" value="research">
                        Research

                        <input type="checkbox" name="interest" value="purchase">
                        Purchase
                    </td>
                </tr>

                <tr>
                    <td>Occupation:</td>
                    <td>
                        <select name="occupation" required>
                            <option value="">Select one</option>
                            <option>Student</option>
                            <option>Teacher</option>
                            <option>Engineer</option>
                            <option>Doctor</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Want us to send you junk emails?</td>
                    <td>
                        <input type="radio" name="junk" value="absolutely">
                        absolutely

                        <input type="radio" name="junk" value="no way man">
                        no way man
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="submit" value="Submit">
                    </td>
                    <td>
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>
        </form>
    </div>


    <br><br>


    <!-- Assignment 3 - Online Registration -->
    <div>
        <h2>Online Registration Form</h2>

        <form>
            <table>

                <tr>
                    <td>Username:</td>
                    <td>
                        <input type="text"
                               name="username"
                               placeholder="Enter username"
                               required>
                    </td>
                </tr>

                <tr>
                    <td>Password:</td>
                    <td>
                        <input type="password"
                               name="password"
                               placeholder="Enter password"
                               required>
                    </td>
                </tr>

                <tr>
                    <td>Confirm Password:</td>
                    <td>
                        <input type="password"
                               name="confirm_password"
                               placeholder="Confirm password"
                               required>
                    </td>
                </tr>

                <tr>
                    <td>Name:</td>
                    <td>
                        <input type="text"
                               name="name"
                               placeholder="Enter your name"
                               required>
                    </td>
                </tr>

                <tr>
                    <td>Gender:</td>
                    <td>
                        <input type="radio" name="gender" value="male">
                        Male

                        <input type="radio" name="gender" value="female">
                        Female
                    </td>
                </tr>

                <tr>
                    <td>Address:</td>
                    <td>
                        <textarea name="address"
                                  rows="5"
                                  cols="30"
                                  placeholder="Enter your address"
                                  required></textarea>
                    </td>
                </tr>

                <tr>
                    <td>Profession:</td>
                    <td>
                        <select name="profession" required>
                            <option value="">Select Profession</option>
                            <option>Student</option>
                            <option>Teacher</option>
                            <option>Engineer</option>
                            <option>Doctor</option>
                        </select>
                    </td>
                </tr>

                <tr>
                    <td>Upload Files:</td>
                    <td>
                        <input type="file" name="files" multiple>
                    </td>
                </tr>

                <tr>
                    <td>
                        <input type="submit" value="Submit">
                    </td>
                    <td>
                        <input type="reset" value="Reset">
                    </td>
                </tr>

            </table>
        </form>
    </div>

</body>
</html>
